name: valora_mobile
description: Nuova app Android di COLLECTION by VALORA, ambiente TEST2.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - valora_logo.png
    - assets/themes/

flutter_launcher_icons:
  android: true
  image_path: "valora_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "valora_logo.png"
