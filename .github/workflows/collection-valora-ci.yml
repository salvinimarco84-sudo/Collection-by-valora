name: COLLECTION by VALORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android platform files
        run: flutter create . --platforms=android
      - name: Remove generated placeholder widget test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze lib/main.dart --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Check source contracts
        run: python scripts/static_contract_check.py
      - name: Build Android APK
        run: flutter build apk --release
