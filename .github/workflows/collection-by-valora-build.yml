
name: COLLECTION by VALORA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project
        run: |
          mkdir -p lib test
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
          if [ -f widget_test.dart ]; then cp widget_test.dart test/widget_test.dart; fi
          flutter create . --platforms=android --project-name collection_by_valora

      - name: Verify Android Internet permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          grep -n 'android.permission.INTERNET' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lib, test | Out-Null
          if (Test-Path main.dart) {
            Copy-Item main.dart lib/main.dart -Force
          }
          if (Test-Path widget_test.dart) {
            Copy-Item widget_test.dart test/widget_test.dart -Force
          }
          flutter create . --platforms=windows --project-name collection_by_valora
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        continue-on-error: true
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
