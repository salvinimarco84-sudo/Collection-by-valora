name: COLLECTION by VALORA Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build-android:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Prepare Flutter project
    run: |
      mkdir -p lib test
      if [ -f main.dart ]; then cp main.dart lib/main.dart; fi
      if [ -f widget_test.dart ]; then cp widget_test.dart test/widget_test.dart; fi
      flutter create . --platforms=android --project-name collection_by_valora

  - name: Install dependencies
    run: flutter pub get

  - name: Analyze
    run: flutter analyze

  - name: Run tests
    run: flutter test

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: collection-by-valora-android-apk
      path: build/app/outputs/flutter-apk/app-release.apk
      retention-days: 14

build-windows:
runs-on: windows-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Prepare Flutter project
    shell: pwsh
    run: |
      New-Item -ItemType Directory -Force lib, test | Out-Null
      if (Test-Path main.dart) { Copy-Item main.dart lib/main.dart -Force }
      if (Test-Path widget_test.dart) { Copy-Item widget_test.dart test/widget_test.dart -Force }
      flutter create . --platforms=windows --project-name collection_by_valora

  - name: Install dependencies
    run: flutter pub get

  - name: Analyze
    run: flutter analyze

  - name: Run tests
    run: flutter test

  - name: Build Windows
    run: flutter build windows --release

  - name: Upload Windows build
    uses: actions/upload-artifact@v4
    with:
      name: collection-by-valora-windows
      path: build/windows/x64/runner/Release/
      retention-days: 14
