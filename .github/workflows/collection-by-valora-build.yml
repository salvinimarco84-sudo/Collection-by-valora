# Re-trigger validation after enabling PR builds.
name: COLLECTION by VALORA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/blocco-utente
      - feature/pr12-engine-test-current
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify required root files
        shell: bash
        run: |
          set -euo pipefail
          test -f FLAT__lib__main.dart
          test -f FLAT__pubspec.yaml
          test -f valora_logo.png
          test -f apply_valora_logo.py

      - name: Install Pillow for Android launcher icon
        run: python -m pip install Pillow

      - name: Prepare clean Flutter Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib test assets
          # Recreate platform scaffolding to avoid stale native plugin registrants.
          rm -rf android
          flutter create . --platforms=android --project-name collection_by_valora
          # The resolved Android lifecycle plugin requires compileSdk 36.
          # Set compileSdk only; keep targetSdk and minSdk unchanged.
          python - <<'PY'
          from pathlib import Path
          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")
          if gradle_kts.exists():
              p = gradle_kts
              content = p.read_text()
              old = "compileSdk = flutter.compileSdkVersion"
              new = "compileSdk = 36"
          elif gradle_groovy.exists():
              p = gradle_groovy
              content = p.read_text()
              old = "compileSdkVersion flutter.compileSdkVersion"
              new = "compileSdkVersion 36"
          else:
              raise SystemExit("Android app Gradle file not found")
          if old not in content:
              raise SystemExit(f"Expected compileSdk declaration not found in {p}")
          p.write_text(content.replace(old, new, 1))
          print(f"Set Android compileSdk to 36 in {p}")
          PY
          cp FLAT__lib__main.dart lib/main.dart
          cp FLAT__pubspec.yaml pubspec.yaml
          cp valora_logo.png assets/valora_logo.png
          python apply_valora_logo.py
          rm -f test/widget_test.dart widget_test.dart main.dart

      - name: Verify Android Internet permission
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze application source
        run: flutter analyze lib/main.dart --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify required root files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("FLAT__lib__main.dart", "FLAT__pubspec.yaml", "valora_logo.png", "apply_valora_logo.py")) {
            if (-not (Test-Path $file)) { throw "File richiesto mancante: $file" }
          }

      - name: Install Pillow for launcher icon script
        run: python -m pip install Pillow

      - name: Prepare clean Flutter Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force lib, test, assets | Out-Null
          # Recreate platform scaffolding to avoid stale generated platform files.
          if (Test-Path windows) { Remove-Item windows -Recurse -Force }
          flutter create . --platforms=windows --project-name collection_by_valora
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item FLAT__lib__main.dart lib/main.dart -Force
          Copy-Item FLAT__pubspec.yaml pubspec.yaml -Force
          Copy-Item valora_logo.png assets/valora_logo.png -Force
          python apply_valora_logo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item test/widget_test.dart -Force -ErrorAction SilentlyContinue
          Remove-Item widget_test.dart -Force -ErrorAction SilentlyContinue
          Remove-Item main.dart -Force -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze application source
        run: flutter analyze lib/main.dart --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
