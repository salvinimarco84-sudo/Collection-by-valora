name: Install COLLECTION by VALORA flat upload

on:
  push:
    branches: [main]
    paths:
      - 'FLAT__*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Rebuild project folders from flat files
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import shutil
          root = Path('.')
          prefix = 'FLAT__'
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name.startswith(prefix))
          if not files:
              raise SystemExit('Nessun file FLAT__ trovato nella radice.')
          for source in files:
              relative = source.name[len(prefix):].replace('__', '/')
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              print(f'{source.name} -> {relative}')
          # Remove only the transport copies after reconstruction.
          for source in files:
              source.unlink()
          PYCODE

      - name: Commit reconstructed project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da registrare.'
            exit 0
          fi
          git commit -m 'Install COLLECTION by VALORA 0.3.0+15 project structure'
          git push
