name: COLLECTION by VALORA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FLAT__lib__main.dart'
      - 'FLAT__pubspec.yaml'
      - 'valora_logo.png'
      - 'apply_valora_logo.py'
      - '.github/workflows/collection-by-valora-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (Run 44 + OGGETTO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validate replacement inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s FLAT__lib__main.dart
          test -s FLAT__pubspec.yaml
          test -s valora_logo.png
          test -s apply_valora_logo.py
          mkdir -p lib test assets
          cp FLAT__lib__main.dart lib/main.dart
          cp FLAT__pubspec.yaml pubspec.yaml
          cp valora_logo.png assets/valora_logo.png
          flutter create . --platforms=android --project-name collection_by_valora
          cp FLAT__lib__main.dart lib/main.dart
          cp FLAT__pubspec.yaml pubspec.yaml
          cp valora_logo.png assets/valora_logo.png
          python apply_valora_logo.py
          rm -f test/widget_test.dart widget_test.dart main.dart
      - name: Verify Android Internet permission
        shell: bash
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          test -f "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze application source
        run: flutter analyze lib/main.dart --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
