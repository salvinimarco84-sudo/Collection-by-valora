name: COLLECTION by VALORA - Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'COLLECTION_by_VALORA_flutter_UI/**'
      - '.github/workflows/collection-by-valora-build.yml'

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Analyze and test Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: COLLECTION_by_VALORA_flutter_UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Windows platform scaffolding
        run: flutter create . --platforms=android,windows --project-name collection_by_valora
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test --reporter expanded

  android-apk:
    name: Build Android APK (TEST UI)
    runs-on: ubuntu-latest
    needs: flutter-tests
    defaults:
      run:
        working-directory: COLLECTION_by_VALORA_flutter_UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name collection_by_valora
      - name: Resolve packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-android-apk
          path: COLLECTION_by_VALORA_flutter_UI/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    name: Build Windows app
    runs-on: windows-latest
    needs: flutter-tests
    defaults:
      run:
        working-directory: COLLECTION_by_VALORA_flutter_UI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows platform
        run: flutter create . --platforms=windows --project-name collection_by_valora
      - name: Resolve packages
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../collection-by-valora-windows.zip -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-windows
          path: collection-by-valora-windows.zip
          if-no-files-found: error
          retention-days: 14
