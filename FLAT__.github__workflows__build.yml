name: COLLECTION by VALORA - build and test

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform wrappers
        run: flutter create --platforms=android,windows .
      - name: Configure Android voice permissions
        run: python scripts/prepare_android_manifest.py
      - name: Verify repository static contracts
        run: python scripts/static_contract_check.py
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    name: Analyze, test and build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform wrappers
        shell: pwsh
        run: flutter create --platforms=android,windows .
      - name: Verify repository static contracts
        run: python scripts/static_contract_check.py
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build Windows application
        run: flutter build windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-by-valora-windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
